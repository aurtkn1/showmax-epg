
name: Showmax EPG Otomatik Güncelleme

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository Checkout
        uses: actions/checkout@v4

      - name: Node.js Setup
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Generate Showmax EPG
        run: node generate_showmax_epg.js

      - name: Save Updated XML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add showmax.xml

          if git diff --cached --quiet; then
            echo "EPG değişmedi, commit gerekmiyor."
          else
            git commit -m "Showmax EPG otomatik güncellendi"
            git push
          fi
